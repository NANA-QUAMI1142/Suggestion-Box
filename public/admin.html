<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Suggestion Box</title>
<style>
body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;padding:20px}
.card{background:white;width:100%;max-width:650px;padding:25px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.08)}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;box-sizing:border-box;margin-top:10px}
button{width:100%;padding:12px;background:#1a8a4a;color:white;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#14723b}
.sugg{border-left:4px solid #1a8a4a;background:#f9f9f9;padding:12px;margin:12px 0;border-radius:6px;text-align:left;font-size:14px}
#adminContent{display:none}
#error{color:red;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h2 style="text-align:center">🔒 Admin Login</h2>

<div id="loginBox">
<p style="font-size:13px;color:#666;text-align:center">Enter password to view suggestions</p>
<input type="password" id="pwd" placeholder="Password">
<button onclick="login()">Login</button>
<p id="error"></p>
</div>

<div id="adminContent">
<h3>All Anonymous Suggestions</h3>
<div id="list">Loading...</div>
<button onclick="logout()" style="background:#777;margin-top:20px">Logout</button>
<a href="/" style="display:block;text-align:center;margin-top:15px;font-size:12px;color:#888">Back to Home</a>
</div>
</div>

<script>
const ADMIN_DEFAULT = "admin@00";
let savedPwd = localStorage.getItem('admin_pwd');
if(savedPwd){ document.getElementById('pwd').value = savedPwd; login(); }

async function login(){
  let p = document.getElementById('pwd').value.trim();
  if(!p) return;
  let res = await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p})});
  if(!res.ok){
    document.getElementById('error').innerText = "❌ Wrong password!";
    return;
  }
  localStorage.setItem('admin_pwd', p);
  loadSuggestions(p);
}

async function loadSuggestions(pwd){
  let res = await fetch('/api/admin/suggestions',{headers:{'x-admin-password': pwd}});
  if(res.status===403){
    document.getElementById('error').innerText = "Unauthorized";
    return;
  }
  let data = await res.json();
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminContent').style.display='block';
  let list = document.getElementById('list');
  if(data.length===0){ list.innerHTML = "<p>No suggestions yet.</p>"; return; }
  list.innerHTML = data.slice().reverse().map(s=>`<div class="sugg"><small>${s.date} - Anonymous</small><br><br>${s.text}</div>`).join('');
}

function logout(){
  localStorage.removeItem('admin_pwd');
  location.reload();
}
</script>
</body>
</html>
