<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
<style>
body{font-family:Arial;background:#f0f2f5;display:flex;justify-content:center;padding:20px}
.card{background:white;width:100%;max-width:700px;padding:25px;
  border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);text-align:center}
.logo{width:110px;margin:0 auto 5px;display:block}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #ddd;box-sizing:border-box}
button{width:100%;padding:12px;background:#1a8a4a;color:white;border:none;border-radius:8px;
  font-weight:bold;cursor:pointer;margin-top:10px}
.sugg{border-left:4px solid #1a8a4a;background:#f9f9f9;padding:12px;margin:14px 0;
  border-radius:8px;text-align:left;position:relative}
.del{position:absolute;top:8px;right:8px;background:#ff3b30;
  width:auto;padding:5px 12px;font-size:12px;border-radius:6px}
.tab{padding:10px;background:#eee;border-radius:8px;cursor:pointer;
  display:inline-block;width:48%;font-weight:bold;font-size:14px}
.tab.active{background:#1a8a4a;color:white}
.home-btn{display:block;text-align:center;margin-top:18px;padding:11px;background:white;
border:1px solid #ddd;color:#333;border-radius:8px;
text-decoration:none;font-weight:bold;font-size:14px}
/* FIX text wrapping */
p, div {
  overflow-wrap: break-word !important;
  word-break: break-word !important;
}
.suggestion-item div:nth-child(2) {
  white-space: normal !important;
  overflow-wrap: anywhere !important;
  max-width: 75%;
}
</style>
</head>
<body>
<div class="card">
<img src="/logo.png" class="logo">
<div id="loginBox">
<h2>🔒 Admin Login</h2>
<input type="password" id="pwd" placeholder="Password"><button onclick="login()">Login</button>
<p id="error" style="color:red"></p>
<a href="/" class="home-btn">← Back to Home</a>
</div>
<div id="adminContent" style="display:none">
<div style="display:flex;gap:5px;justify-content:space-between;margin-bottom:15px">
<div class="tab active" id="tab1" onclick="showTab('sugg')">Suggestions</div>
<div class="tab" id="tab2" onclick="showTab('staff')">Staff IDs</div>
</div>
<div id="suggTab"><div id="list"></div></div>
<div id="staffTab" style="display:none;text-align:left">
<input id="newStaffId" placeholder="Enter new Staff ID e.g. AUD010">
<button onclick="addStaff()">Add Staff ID</button>
<div id="staffList" style="margin-top:15px"></div>
<p style="font-size:12px;color:#888;margin-top:10px">
  If list is empty, any Staff ID can submit (open mode). Add IDs to lock it.</p>
</div>
<a href="/" class="home-btn">← Back to Home</a>
</div>
</div>
<script>
let currentPwd="";
async function login(){
  let p=document.getElementById('pwd').value;
  let res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({password:p})});
  if(!res.ok){document.getElementById('error').innerText="❌ Wrong password!";return;}
  currentPwd=p; document.getElementById('loginBox').style.display='none';
  document.getElementById('adminContent').style.display='block'; loadSuggestions(); loadStaff();
}
function showTab(t){
  document.getElementById('suggTab').style.display=t==='sugg'?'block':'none';
  document.getElementById('staffTab').style.display=t==='staff'?'block':'none';
  document.getElementById('tab1').className=t==='sugg'?'tab active':'tab';
  document.getElementById('tab2').className=t==='staff'?'tab active':'tab';
}
async function loadSuggestions(){
  let res=await fetch('/api/admin/suggestions',{headers:{'x-admin-password':currentPwd}});
  let data=await res.json();
  document.getElementById('list').innerHTML=data.length?data.slice().reverse().map(s=>`
  <div class="sugg"><button class="del" onclick="delSug(${s.id})">Delete</button>
    <small>${s.date}</small><br><br>${s.text}</div>`).join(''):"No suggestions";
}
async function delSug(id){ if(!confirm("Delete?"))return; await fetch(`/api/admin/suggestions/${id}`,
{method:'DELETE',headers:{'x-admin-password':currentPwd}}); loadSuggestions(); }
async function loadStaff(){
  let res=await fetch('/api/admin/staff',{headers:{'x-admin-password':currentPwd}});
  let data=await res.json();
  document.getElementById('staffList').innerHTML=data.length?data.map(id=>`
  <div style="background:#f9f9f9;padding:8px;border-radius:6px;margin:5px 0;
  display:flex;justify-content:space-between">${id}<span style="color:red;
  cursor:pointer" onclick="delStaff('${id}')">✕ Delete</span></div>`).join(''):"<p>No Staff IDs yet - Open mode (any ID allowed)</p>";
}
async function addStaff(){
  let id=document.getElementById('newStaffId').value; if(!id) return;
  await fetch('/api/admin/staff',{method:'POST',headers:{'Content-Type':'application/json',
  'x-admin-password':currentPwd},body:JSON.stringify({id})});
  document.getElementById('newStaffId').value=''; loadStaff();
}
async function delStaff(id){ await fetch(`/api/admin/staff/${id}`,{method:'DELETE',
headers:{'x-admin-password':currentPwd}}); loadStaff(); }
</script>
</body>
</html>
