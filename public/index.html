<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestion Box</title>
<style>
body{font-family:Arial;background:#f4f6f9;display:flex;justify-content:center;padding:20px}
.box{background:white;width:100%;max-width:500px;padding:25px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1)}
.logo{height:70px;display:block;margin:0 auto 10px;border-radius:8px}
h2{text-align:center;margin:5px 0}
p.sub{text-align:center;color:#666;font-size:14px}
textarea{width:100%;height:90px;padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:10px}
button.main{width:100%;background:#1a8a4a;color:white;padding:12px;border:none;border-radius:8px;margin-top:10px;font-weight:bold;cursor:pointer}
.sugg{border-left:4px solid #1a8a4a;background:#f9f9f9;padding:10px 12px;margin-top:12px;border-radius:6px}
.meta{font-size:12px;color:#888;margin-bottom:4px}
.admin-link{text-align:center;margin-top:20px}
.admin-link a{font-size:13px;color:#888;text-decoration:none;cursor:pointer}
</style>
</head>
<body>
<div class="box">
<img src="/logo.png" class="logo" alt="Logo">
<h2>💡 Suggestion Box</h2>
<p class="sub">Share your ideas anonymously!</p>
<textarea id="text" placeholder="Type your suggestion here..."></textarea>
<label style="font-size:13px"><input type="checkbox" id="anon" checked> Submit anonymously</label>
<button class="main" onclick="submitSugg()">Submit Suggestion</button>
<div id="status" style="font-size:13px;color:green;margin-top:8px"></div>

<h3 style="margin-top:25px">Recent Suggestions</h3>
<div id="list">Loading...</div>

<div class="admin-link"><a onclick="adminLogin()">🔒 Admin Login</a></div>
</div>

<script>
async function load(){
  let res = await fetch('/api/suggestions');
  let data = await res.json();
  let html = '';
  data.reverse().forEach(s=>{
    let time = s.createdAt ? new Date(s.createdAt).toLocaleString('en-GH',{hour:'numeric',minute:'2-digit',hour12:true,day:'numeric',month:'short'}) : '';
    html += `<div class="sugg"><div class="meta">Anonymous • ${time}</div><div>${s.text || s.content}</div></div>`;
  });
  document.getElementById('list').innerHTML = html || 'No suggestions yet';
}
async function submitSugg(){
  let text = document.getElementById('text').value;
  if(!text) return;
  await fetch('/api/suggestions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:text})});
  document.getElementById('text').value='';
  document.getElementById('status').innerText='✅ Submitted!';
  load();
}
async function adminLogin(){
  let pw = prompt("Enter Admin Password:");
  if(!pw) return;
  let res = await fetch(`/api/admin-login?password=${pw}`);
  let data = await res.json();
  if(data.ok){ window.location.href = '/admin.html'; } 
  else { alert("Wrong password!"); }
}
load();
</script>
</body>
</html>
