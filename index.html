<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suggestion Box</title>
<style>
body{font-family:Arial; background:#f0f2f5; padding:20px; max-width:600px; margin:auto}
.card{background:white; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); margin-bottom:20px}
textarea{width:100%; height:100px; padding:10px; border:1px solid #ddd; border-radius:6px; resize:none}
button{width:100%; padding:12px; background:#4CAF50; color:white; border:none; border-radius:6px; font-size:16px; cursor:pointer; margin-top:10px}
button:hover{background:#45a049}
.suggestion-item{border-left:4px solid #4CAF50; padding:10px; margin:10px 0; background:#f9f9f9; border-radius:4px}
</style>
</head>
<body>

<div class="card">
<h2>💡 Suggestion Box</h2>
<p>Share your ideas anonymously!</p>
<textarea id="msg" placeholder="Type your suggestion here..."></textarea>
<label style="display:block; margin-top:10px;"><input type="checkbox" id="anon" checked> Submit anonymously</label>
<button id="submitBtn">Submit Suggestion</button>
<div id="status" style="margin-top:10px; color:green; display:none;">✅ Submitted!</div>
</div>

<div class="card">
<h3>Recent Suggestions</h3>
<div id="list">Loading...</div>
</div>

<script>
const msgEl = document.getElementById('msg');
const anonEl = document.getElementById('anon');
const btn = document.getElementById('submitBtn');
const list = document.getElementById('list');
const status = document.getElementById('status');

async function load() {
  try {
    const res = await fetch('/api/suggestions');
    const data = await res.json();
    if (data.length === 0) {
      list.innerHTML = '<p>No suggestions yet</p>';
      return;
    }
    list.innerHTML = data.slice().reverse().map(s => `
      <div class="suggestion-item">
        <div>${s.message}</div>
        <small style="color:#777">${s.anonymous ? 'Anonymous' : 'User'} • ${new Date(s.createdAt).toLocaleTimeString()}</small>
      </div>
    `).join('');
  } catch(e) {
    list.innerHTML = 'Failed to load';
  }
}

btn.onclick = async () => {
  const message = msgEl.value.trim();
  if (!message) return alert('Please type a suggestion');
  btn.textContent = 'Submitting...';
  try {
    const res = await fetch('/api/suggestions', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ message, anonymous: anonEl.checked })
    });
    if (!res.ok) throw new Error();
    msgEl.value = '';
    status.style.display = 'block';
    setTimeout(()=>status.style.display='none',2000);
    load();
  } catch(e) {
    alert('Error submitting');
  } finally {
    btn.textContent = 'Submit Suggestion';
  }
};

load();
</script>
</body>
</html>
