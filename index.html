<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggestion Box</title>
  <style>
    body { font-family: monospace; background: #f5f5f5; padding: 20px; max-width: 600px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; overflow: hidden; }
    textarea, input[type="text"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-family: monospace; }
    textarea { height: 90px; }
    #nameField { display: none; margin-top: 10px; }
    #submitBtn { width: 100%; background: #4CAF50; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    #submittedMsg { display: none; background: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 8px; text-align: center; margin-top: 10px; font-weight: bold; }
    .sug-item { 
      border-left: 4px solid #4CAF50; 
      padding: 10px 12px; 
      margin: 10px 0; 
      background: #fafafa; 
      border-radius: 6px; 
      box-sizing: border-box;
      word-break: break-all !important;
      overflow-wrap: anywhere !important;
      white-space: pre-wrap !important;
    }
    .sug-meta { font-size: 11px; color: #888; margin-top: 5px; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>💡 Suggestion Box</h2>
    <label style="display:flex; align-items:center; gap:6px; margin-bottom:10px;">
      <input type="checkbox" id="anonCheck" checked> Submit anonymously
    </label>
    <div id="nameField"><input type="text" id="nameInput" placeholder="Your name"></div>
    <textarea id="msg" placeholder="Type your suggestion..."></textarea>
    <button id="submitBtn">Submit Suggestion</button>
    <div id="submittedMsg">✅ Submitted!</div>
  </div>

  <div class="card">
    <h3>Recent Suggestions</h3>
    <div id="list">Loading...</div>
  </div>

<script>
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');
const list = document.getElementById('list');
const anonCheck = document.getElementById('anonCheck');
const nameField = document.getElementById('nameField');
const nameInput = document.getElementById('nameInput');
const submittedMsg = document.getElementById('submittedMsg');

anonCheck.addEventListener('change', () => {
  nameField.style.display = anonCheck.checked ? 'none' : 'block';
});

async function load() {
  const res = await fetch('/api/suggestions?t=' + Date.now());
  const data = await res.json();
  if (!data.length) { list.innerHTML = '<p>No suggestions yet</p>'; return; }
  list.innerHTML = data.map(s => {
    let text = (s.text || s.message || '').toString();
    if (text.trim().startsWith('{"_id"')) return '';
    let displayName = s.anonymous ? 'Anonymous' : (s.name || 'Anonymous');
    let time = s.createdAt ? new Date(s.createdAt).toLocaleString() : '';
    // THIS FIXES THE - ISSUE
    return `<div class="sug-item"><b>${displayName}:</b> ${text}<span class="sug-meta">${displayName} • ${time}</span></div>`;
  }).join('');
}

async function submit() {
  const text = msg.value.trim();
  if (!text) return;
  const isAnonymous = anonCheck.checked;
  const name = isAnonymous ? null : (nameInput.value.trim() || null);

  await fetch('/api/suggestions', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ text, name, anonymous: isAnonymous })
  });

  msg.value = ''; nameInput.value = '';
  btn.style.display = 'none';
  submittedMsg.style.display = 'block';
  load();

  setTimeout(() => {
    submittedMsg.style.display = 'none';
    btn.style.display = 'block';
  }, 3000);
}

btn.addEventListener('click', submit);
load();
</script>
</body>
</html>
