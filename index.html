<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggestion Box</title>
  <style>
    body { font-family: monospace; background: #f5f5f5; padding: 20px; max-width: 600px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-family: monospace; height: 90px; }
    #submitBtn { width: 100%; background: #4CAF50; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>💡 Suggestion Box</h2>
    <p>Share your ideas anonymously!</p>
    <textarea id="msg" placeholder="Type your suggestion here..."></textarea>
    <button id="submitBtn">Submit Suggestion</button>
    <div id="status"></div>
  </div>
  <div class="card">
    <h3>Recent Suggestions</h3>
    <div id="list">Loading...</div>
  </div>

<script>
const msg = document.getElementById('msg');
const btn = document.getElementById('submitBtn');
const list = document.getElementById('list');
const status = document.getElementById('status');

async function load() {
  try {
    const res = await fetch('/api/suggestions');
    const data = await res.json();
    if (!data.length) { list.innerHTML = '<p>No suggestions yet</p>'; return; }
    list.innerHTML = data.map(s => {
      const text = s.text || s.message || '';
      return `<div style="border-left:3px solid #4CAF50;padding:10px;margin:8px 0;background:#fff;border-radius:6px"><b>Anonymous</b>: ${text}<br><small style="color:#888">${new Date(s.createdAt).toLocaleString()}</small></div>`;
    }).join('');
  } catch(e) { list.innerHTML = '<p>Failed to load</p>'; }
}
async function submit() {
  const text = msg.value.trim(); if(!text) return;
  btn.disabled = true;
  await fetch('/api/suggestions', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({text, anonymous:true})});
  msg.value = ''; status.textContent = 'Submitted! ✅'; setTimeout(()=>status.textContent='',2000);
  btn.disabled = false; load();
}
btn.addEventListener('click', submit);
load();
</script>
</body>
</html>
