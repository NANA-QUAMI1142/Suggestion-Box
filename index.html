<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suggestion Box</title>
  <style>
    body { font-family: monospace; background: #f5f5f5; padding: 20px; max-width: 600px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-family: monospace; height: 90px; }
    #submitBtn { width: 100%; background: #4CAF50; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>💡 Suggestion Box</h2>
    <p>Share your ideas anonymously!</p>
    <textarea id="msg" placeholder="Type your suggestion here..."></textarea>
    <button id="submitBtn">Submit Suggestion</button>
    <div id="status"></div>
  </div>

  <div class="card">
    <h3>Recent Suggestions</h3>
    <div id="list">Loading...</div>
  </div>

  <script src="script.js?v=10"></script>
</body>
</html>
