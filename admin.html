<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Delete Suggestions</title>
<style>body{font-family:sans-serif;max-width:600px;margin:auto;padding:15px}.card{background:white;padding:15px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.1);margin-bottom:10px}.del{float:right;background:#d32f2f;color:white;border:none;padding:5px 10px;border-radius:5px;cursor:pointer}</style>
</head>
<body>
<h2>Admin Panel</h2>
<input type="password" id="pass" placeholder="Enter admin password" style="width:100%;padding:10px;margin-bottom:10px">
<button onclick="loadAdmin()" style="width:100%;padding:10px">Login & Load</button>
<div id="list" style="margin-top:20px"></div>
<script>
async function loadAdmin(){
  const password = document.getElementById('pass').value;
  const res = await fetch('/api/suggestions?t='+Date.now());
  const data = await res.json();
  document.getElementById('list').innerHTML = data.map(s=>`
    <div class="card">
      <button class="del" onclick="delSug('${s._id}')">Delete</button>
      <div>${s.text || s.message}</div>
      <small style="color:#888">${s.anonymous?'Anonymous':s.name} • ${new Date(s.createdAt).toLocaleString()}</small>
    </div>
  `).join('');
}
async function delSug(id){
  if(!confirm('Delete this suggestion?')) return;
  const password = document.getElementById('pass').value;
  await fetch('/api/suggestions/'+id, { method: 'DELETE', headers:{'x-admin-password': password} });
  loadAdmin();
}
</script>
</body>
</html>
